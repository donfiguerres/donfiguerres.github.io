baseURL: https://donfiguerres.com/
locale: "en-us"
title: "Don Figuerres"

# Use Hugo modules to add theme
module:
  imports:
  - path: github.com/hugo-toha/toha/v4
  mounts:
  - source: static/files
    target: static/files
  - source: ./node_modules/flag-icons/flags
    target: static/flags
  - source: ./node_modules/@fontsource/mulish/files
    target: static/files
  - source: ./node_modules/katex/dist/fonts
    target: static/fonts

# Manage languages
# For any more details, you can check the official documentation: https://gohugo.io/content-management/multilingual/
languages:
  en:
    locale: en
    label: English
    title: "Don Figuerres"
    weight: 1
defaultContentLanguage: en

# Control TOC depth
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

# At least HTML and JSON are required for the main HTML content and
# client-side JavaScript search
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Enable global emoji support
enableEmoji: true

# Site parameters
params:
  # GitHub repo URL and branch of your site
  gitRepo: https://github.com/donfiguerres/donfiguerres.github.io
  gitBranch: main
  background: /images/sunset20200425.jpg

  # Theme feature flags
  features:
    blog:
      enable: true
    toc:
      enable: true
    theme:
      enable: true
      services:
        light: true
        dark: true
        default: dark

  # Provide footer configuration.
  footer:
    newsletter:
      enable: false